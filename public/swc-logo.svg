<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <linearGradient id="swcBrandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A84338" />
      <stop offset="50%" stop-color="#8E2F26" />
      <stop offset="100%" stop-color="#6E1B15" />
    </linearGradient>
  </defs>

  <!-- SHIELD EMBLEM (Exact Vector Representation of SWC Official Brand Identity) -->
  <g transform="translate(20, 10)">
    <!-- Outer Shield Border -->
    <path d="M 140 10 C 185 10 242 22 260 36 C 266 95 260 178 212 232 C 180 268 145 288 140 292 C 135 288 100 268 68 232 C 20 178 14 95 20 36 C 38 22 95 10 140 10 Z"
          fill="none" stroke="url(#swcBrandGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Inner Globe Outer Ring -->
    <circle cx="140" cy="116" r="96" fill="none" stroke="url(#swcBrandGrad)" stroke-width="6" />

    <!-- Upper Globe Latitudes & Meridians -->
    <ellipse cx="140" cy="74" rx="86" ry="26" fill="none" stroke="url(#swcBrandGrad)" stroke-width="3.5" />
    <ellipse cx="140" cy="116" rx="94" ry="36" fill="none" stroke="url(#swcBrandGrad)" stroke-width="3.5" />
    <ellipse cx="140" cy="116" rx="52" ry="94" fill="none" stroke="url(#swcBrandGrad)" stroke-width="3.5" />
    <line x1="140" y1="20" x2="140" y2="100" stroke="url(#swcBrandGrad)" stroke-width="3.5" />

    <!-- Continents Silhouettes -->
    <!-- Eurasia / Africa on right -->
    <path d="M 130 38 Q 160 34 186 48 Q 212 62 206 84 Q 188 80 176 94 Q 168 116 180 134 Q 168 142 154 134 Q 140 152 144 172 Q 134 176 125 160 Q 120 130 132 118 Q 118 108 114 88 Q 110 60 130 38 Z" fill="url(#swcBrandGrad)" />
    <!-- Americas on left -->
    <path d="M 66 48 Q 92 44 102 66 Q 92 84 78 94 Q 88 120 74 142 Q 62 134 56 108 Q 52 80 66 48 Z" fill="url(#swcBrandGrad)" />

    <!-- Academic Mortarboard Cap (Center) -->
    <g transform="translate(140, 102)">
      <!-- Diamond Top -->
      <polygon points="0,-32 58,-10 0,12 -58,-10" fill="url(#swcBrandGrad)" />
      <!-- Cap Base Neck -->
      <path d="M -26 -4 L -26 14 C -26 22 26 22 26 14 L 26 -4 Z" fill="url(#swcBrandGrad)" />
      <!-- Tassel on Left (Authentic SWC brand) -->
      <circle cx="0" cy="-10" r="3.5" fill="#FFFFFF" />
      <path d="M 0 -10 Q -28 -6 -36 10 Q -40 20 -38 28" fill="none" stroke="url(#swcBrandGrad)" stroke-width="3.5" stroke-linecap="round" />
      <polygon points="-41,28 -35,28 -36,36 -40,36" fill="url(#swcBrandGrad)" />
    </g>

    <!-- Open Book with "S W C" -->
    <g transform="translate(140, 160)">
      <!-- Book Outer Page Outline -->
      <path d="M -76 -10 Q -38 2 0 -5 Q 38 2 76 -10 L 68 18 Q 34 7 0 14 Q -34 7 -68 18 Z" 
            fill="#FFFFFF" stroke="url(#swcBrandGrad)" stroke-width="5" stroke-linejoin="round" />
      <!-- Center Spine Divider -->
      <line x1="0" y1="-5" x2="0" y2="14" stroke="url(#swcBrandGrad)" stroke-width="3" />
      <!-- Letters S  W  C -->
      <text x="-42" y="8" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#8E2F26" text-anchor="middle">S</text>
      <text x="0" y="8" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#8E2F26" text-anchor="middle">W</text>
      <text x="42" y="8" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#8E2F26" text-anchor="middle">C</text>
    </g>

    <!-- Lower Globe Hemisphere Grid -->
    <ellipse cx="140" cy="216" rx="60" ry="24" fill="none" stroke="url(#swcBrandGrad)" stroke-width="4" />
    <ellipse cx="140" cy="236" rx="40" ry="14" fill="none" stroke="url(#swcBrandGrad)" stroke-width="3.5" />
    <line x1="140" y1="174" x2="140" y2="250" stroke="url(#swcBrandGrad)" stroke-width="4" />
    <line x1="112" y1="184" x2="116" y2="242" stroke="url(#swcBrandGrad)" stroke-width="3" />
    <line x1="168" y1="184" x2="164" y2="242" stroke="url(#swcBrandGrad)" stroke-width="3" />
  </g>

  <!-- TYPOGRAPHY BELOW SHIELD -->
  <g transform="translate(160, 324)" text-anchor="middle">
    <!-- STUDY WORLD -->
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="28" 
          letter-spacing="0.5" 
          fill="#701C18">
      STUDY WORLD
    </text>

    <!-- CONSULTANT -->
    <text x="-38" y="30" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="26" 
          letter-spacing="1" 
          fill="#701C18">
      CONSULTANT
    </text>

    <!-- SINCE 2016 BADGE -->
    <g transform="translate(56, 12)">
      <rect x="0" y="0" width="94" height="22" rx="2" fill="#701C18" />
      <text x="47" y="16" 
            font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
            font-weight="900" 
            font-size="11.5" 
            letter-spacing="0.5" 
            fill="#FFFFFF" 
            text-anchor="middle">
        SINCE 2016
      </text>
    </g>
  </g>
</svg>
