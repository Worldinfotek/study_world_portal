name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish-dist:
    name: Publish dist for Plesk
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: dist
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "dist is already up to date"
            exit 0
          fi
          git commit -m "chore: refresh production build [skip ci]"
          git push

  deploy-ftp:
    name: Optional Plesk FTP deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: dist
      - name: Upload dist to Plesk
        if: ${{ env.PLESK_FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PLESK_FTP_HOST }}
          username: ${{ secrets.PLESK_FTP_USER }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: dist/
          dangerous-clean-slate: false
    env:
      PLESK_FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
